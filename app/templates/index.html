<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TinyStegoNet – Image Steganography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .image-preview {
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .card-title {
      font-size: 1rem;
      text-align: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="text-center mb-4">🧠 TinyStegoNet – Deep Learning Image Steganography</h2>

  <form method="POST" enctype="multipart/form-data" class="p-4 mb-5 bg-white shadow rounded">
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Upload Cover Image</label>
        <input type="file" class="form-control" name="cover" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Upload Secret Image</label>
        <input type="file" class="form-control" name="secret" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">🔍 Encode & Decode</button>
  </form>

  {% if cover and secret and stego and recovered %}
  <div class="row text-center mb-4">
    <div class="col-md-3">
      <div class="card">
        <img src="{{ cover }}" class="image-preview card-img-top" alt="Cover">
        <div class="card-body"><h6 class="card-title">Cover Image</h6></div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card">
        <img src="{{ secret }}" class="image-preview card-img-top" alt="Secret">
        <div class="card-body"><h6 class="card-title">Secret Image</h6></div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card">
        <img src="{{ stego }}" class="image-preview card-img-top" alt="Stego">
        <div class="card-body"><h6 class="card-title">Stego Image</h6></div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card">
        <img src="{{ recovered }}" class="image-preview card-img-top" alt="Recovered">
        <div class="card-body"><h6 class="card-title">Recovered Secret</h6></div>
      </div>
    </div>
  </div>

  <div class="text-center">
    <a href="/metrics" class="btn btn-outline-dark">📊 View Evaluation Metrics</a>
  </div>
  {% endif %}
</div>

</body>
</html>
